<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault-07 // База Аномалий</title>
  <link rel="stylesheet" href="./index.css">
  <style>
    .hidden-panel { display: none !important; }

    /* ГЛАВНАЯ СЕТКА КАРТОЧЕК */
    .staff-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 240px); 
      gap: 20px;
      margin-top: 20px;
      height: calc(100vh - 120px); 
      overflow-y: auto !important;
      padding-right: 10px;
      padding-bottom: 30px;
      box-sizing: border-box;
    }

    /* Ретро-скроллбар терминала */
    .staff-grid::-webkit-scrollbar {
      width: 6px;
    }
    .staff-grid::-webkit-scrollbar-track {
      background: #000b05;
      border-left: 1px solid var(--green);
    }
    .staff-grid::-webkit-scrollbar-thumb {
      background: var(--green);
      box-shadow: 0 0 5px var(--green-bright);
    }

    /* ВОЗВРАЩАЕМ РОДНЫЕ КОМПАКТНЫЕ СТИЛИ КАРТОЧЕК */
    .staff-card { 
      border: 1px solid var(--green); 
      padding: 15px; 
      background: #000b05; 
      position: relative; 
      box-shadow: inset 0 0 15px rgba(57,255,106,0.15);
      width: 240px;
      height: 320px; 
      box-sizing: border-box;
    }

    /* ЖЕСТКО ЗАДАЕМ РАЗМЕР АВАТАРА, ЧТОБЫ ОН НЕ РАЗДУВАЛ КАРТОЧКУ */
    .staff-avatar { 
      width: 100%; 
      height: 160px; 
      object-fit: cover; 
      border: 1px solid #087d32; 
      margin-bottom: 10px;
      background: #000f05; 
    }

    .delete-staff-btn { position: absolute; top: 5px; right: 8px; color: #ff3939; cursor: pointer; background: none; border: none; font-size: 16px; font-weight: bold; display: none; }
    .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; border: 1px dashed var(--green); padding: 15px; background: rgba(0,20,5,0.3); }
    .input-group input { background: #000b05 !important; border: 1px solid #39ff6a !important; color: #aaffbd !important; padding: 10px; font-family: inherit; font-size: 14px; }
  </style>
  <link rel="stylesheet" href="./font-override.css">
</head>
<body>
  <div class="crt-geometry"></div><div class="crt-scanline"></div><div class="crt-flicker"></div>
  <div class="terminal-topline">VAULT-07 // ARCHIVE // ANOMALY DATABASE // LOCAL RECOVERY</div>

  <header class="header">
    <div class="logo"><span>[МОРБ]</span></div>
    <nav><a href="./index.html">← На главную</a></nav>
    <div id="p-auth-zone">
      <button class="button" id="adminUnlockBtn">[ РЕЖИМ РЕДАКТИРОВАНИЯ ]</button>
    </div>
  </header>

  <main style="padding: 20px;">
    <!-- ЭКРАН БАЗЫ ДАННЫХ -->
    <section id="databaseScreen">
      <h1 style="color: var(--green-bright); text-shadow: 0 0 10px var(--green); margin-bottom: 15px; font-size: 24px;">АРХИВ: КАТАЛОГ АНОМАЛИЙ </h1>
      
      <!-- Панель добавления аномалии -->
      <div class="input-group hidden-panel" id="adminPanel">
        <span style="color: #39ff6a; font-size: 12px; font-weight: bold; letter-spacing: 1px;">// РЕГИСТРАЦИЯ НОВОГО ОБЪЕКТА В ЛОКАЛЬНЫЙ АРХИВ</span>
        <input type="text" id="anomalyName" placeholder="Название аномалии / Индекс..." maxlength="20">
        <input type="text" id="anomalyRole" placeholder="Класс / Классификация (например: Альфа)..." maxlength="20">
        <input type="text" id="anomalyImg" placeholder="URL-ссылка на снимок (https://...)">
        <button type="button" class="button" id="addAnomalyBtn" style="width: 100%;">[ Внести запись в архив ]</button>
      </div>

      <!-- Сетка для вывода боксов аномалий -->
      <div class="staff-grid" id="anomalyContainer"></div>
    </section>
  </main>
  <!-- Красивое кастомное окно удаления -->
<div id="confirmDeleteModal" class="hidden-panel" style="
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100vw; 
  height: 100vh; 
  background: rgba(0, 11, 5, 0.85); 
  backdrop-filter: blur(2px);
  display: flex; 
  align-items: center; 
  justify-content: center; 
  z-index: 99999;
">
  <div style="
    width: 380px; 
    border: 1px solid #39ff6a; 
    background: #000b05; 
    padding: 25px; 
    box-shadow: 0 0 20px rgba(57,255,106,0.2), inset 0 0 15px rgba(57,255,106,0.15);
    text-align: center;
    box-sizing: border-box;
    position: relative;
  ">
    <!-- Декоративные углы в стиле интерфейсов Fallout -->
    <div style="position: absolute; top: -1px; left: -1px; width: 10px; height: 10px; border-top: 2px solid #39ff6a; border-left: 2px solid #39ff6a;"></div>
    <div style="position: absolute; top: -1px; right: -1px; width: 10px; height: 10px; border-top: 2px solid #39ff6a; border-right: 2px solid #39ff6a;"></div>
    <div style="position: absolute; bottom: -1px; left: -1px; width: 10px; height: 10px; border-bottom: 2px solid #39ff6a; border-left: 2px solid #39ff6a;"></div>
    <div style="position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px; border-bottom: 2px solid #39ff6a; border-right: 2px solid #39ff6a;"></div>

    <!-- Заголовок предупреждения -->
    <p style="
      color: #ff3939; 
      font-size: 11px; 
      font-weight: bold;
      letter-spacing: 2px; 
      margin: 0 0 15px 0;
      text-shadow: 0 0 5px rgba(255,57,57,0.5);
    ">// SYSTEM WARNING // TERMINATION PROCESS</p>
    
    <h2 style="
      color: #39ff6a; 
      margin: 0 0 10px 0; 
      font-size: 18px;
      text-shadow: 0 0 8px var(--green);
      letter-spacing: 1px;
    ">УДАЛИТЬ ЗАПИСЬ?</h2>
    
    <p style="
      color: #aaffbd; 
      font-size: 13px; 
      margin: 0 0 25px 0;
      line-height: 1.4;
      opacity: 0.8;
    ">Это действие необратимо сотрет объект из локального архива убежища.</p>
    
    <!-- Кнопки управления -->
    <div style="display: flex; gap: 15px; justify-content: center;">
      <button type="button" class="button" onclick="document.getElementById('confirmDeleteModal').classList.add('hidden-panel')" style="
        width: 120px; 
        background: transparent; 
        border: 1px solid #39ff6a; 
        color: #39ff6a; 
        padding: 8px; 
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        transition: all 0.2s;
      ">[ ОТМЕНА ]</button>
      
      <button type="button" class="button" id="confirmDeleteBtn" style="
        width: 120px; 
        background: #ff3939; 
        border: 1px solid #ff6666; 
        color: #000; 
        font-weight: bold;
        padding: 8px; 
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        box-shadow: 0 0 10px rgba(255,57,57,0.4);
      ">[ СТЕРЕТЬ ]</button>
    </div>
  </div>
</div>


  <!-- Аудиофайлы ретро-интерфейса -->
  <audio id="click-sound" src="./sounds/hack1.wav" preload="auto"></audio>
  <audio id="success-sound" src="./sounds/send.wav" preload="auto"></audio>

  <!-- Зависимости -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./auth.js"></script>
  <script src="./main.js"></script>
  <script src="./anomaly.js"></script>
</body>
</html>
